name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Check shell scripts
        run: bash -n scripts/md2docx/run_md2docx.sh scripts/md2docx/setup.sh
      - name: Compile Python
        run: python -m compileall -q lecture_tools scripts evals tests
      - name: Validate source contracts
        run: python scripts/validate_pipeline.py --mode source
      - name: Run tests
        run: pytest
