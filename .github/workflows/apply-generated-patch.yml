name: apply generated patch

on:
  push:
    branches: [agent/methodical-numbering-sync]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/methodical-numbering-sync
          fetch-depth: 0
      - name: Verify and apply generated patch
        run: python scripts/apply_generated_patch.py
      - name: Remove one-time bootstrap files
        run: |
          rm -rf .patch
          rm -f scripts/apply_generated_patch.py
          rm -f .github/workflows/apply-generated-patch.yml
      - name: Commit expanded implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add methodical enrichment and lecture-derived numbering"
          git push origin HEAD:agent/methodical-numbering-sync
